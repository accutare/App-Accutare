<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Accutare">
  <title>Accutare</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar no-print">
      <a class="brand" href="#/dashboard"><img src="icons/icon.svg" alt="" width="32" height="32"><span>Accutare</span></a>
      <nav id="sidenav"></nav>
    </aside>
    <div class="content">
      <header class="topbar no-print">
        <div><small id="company-name"></small><h1 id="page-title"></h1></div>
        <div class="new-wrap">
          <button id="new-btn" class="btn primary"></button>
          <div id="new-menu" class="menu" hidden>
            <small>Customers</small>
            <button data-create="invoice">Invoice</button>
            <button data-create="estimate">Estimate</button>
            <button data-create="customer">Customer</button>
            <small>Suppliers</small>
            <button data-create="bill">Bill</button>
            <button data-create="expense">Expense</button>
            <button data-create="vendor">Supplier</button>
          </div>
        </div>
      </header>
      <main id="main"></main>
    </div>
  </div>
  <nav id="bottomnav" class="bottomnav no-print"></nav>
  <div class="nav-scrim no-print" onclick="document.body.classList.remove('nav-open')"></div>
  <div id="modal-root"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
